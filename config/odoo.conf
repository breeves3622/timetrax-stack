[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

# Database Connection Settings
db_host = db
db_port = 5432
db_user = odoo
db_password = secure_odoo_db_password_change_me

# Kiosk Performance & Worker Optimization
workers = 2
max_cron_threads = 1
limit_memory_soft = 640000000
limit_memory_hard = 800000000
limit_time_cpu = 60
limit_time_real = 120
limit_request = 8192
longpolling_port = 8072
