version: '3.8'

services:
  web:
    image: odoo:latest
    container_name: odoo-kiosk-web
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      - HOST=${POSTGRES_HOST:-db}
      - PORT=${POSTGRES_PORT:-5432}
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoopass}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    command: odoo --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons --workers=2 --max-cron-threads=1 --limit-memory-soft=640000000 --limit-memory-hard=800000000 --limit-time-cpu=60 --limit-time-real=120 --limit-request=8192
    restart: always

  db:
    image: postgres:15-alpine
    container_name: odoo-kiosk-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoopass}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  odoo-web-data:
  odoo-db-data:
