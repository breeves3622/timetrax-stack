version: "3.8"

networks:
  timetrax-net:
    name: timetrax-net
    driver: bridge

services:
  # ==========================================
  # 1. TimeTrax Host Application & Webhook Engine
  # ==========================================
  timetrax-host:
    build:
      context: .
      dockerfile: Dockerfile
    image: timetrax-host:latest
    container_name: timetrax-host
    ports:
      - "${TIMETRAX_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-http://ntfy:8080}
      - NTFY_TOPIC=${NTFY_TOPIC:-timetrax-alerts}
      - NTFY_AUTH_TOKEN=${NTFY_AUTH_TOKEN:-}
      - DEFAULT_USER=${DEFAULT_USER:-Developer}
      - DEFAULT_PROJECT=${DEFAULT_PROJECT:-General Tasks}
      - DEFAULT_PRIORITY=${DEFAULT_PRIORITY:-3}
      - ENABLE_CLOCK_IN_WEBHOOKS=${ENABLE_CLOCK_IN_WEBHOOKS:-true}
      - ENABLE_CLOCK_OUT_WEBHOOKS=${ENABLE_CLOCK_OUT_WEBHOOKS:-true}
      - ENABLE_BREAK_WEBHOOKS=${ENABLE_BREAK_WEBHOOKS:-true}
      - API_KEY=${API_KEY:-}
      - DATA_DIR=/app/data
      - TZ=${TZ:-UTC}
    volumes:
      - ${DATA_DIR:-/opt/timetrax/data}:/app/data
    networks:
      - timetrax-net
    depends_on:
      - ntfy
    restart: unless-stopped

  # ==========================================
  # 2. Self-Hosted ntfy Push Notification Server
  # ==========================================
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    ports:
      - "${NTFY_PORT:-8080}:8080"
    environment:
      - TZ=${TZ:-UTC}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8080}
    volumes:
      - ${NTFY_DATA_DIR:-/opt/timetrax/ntfy}/cache:/var/cache/ntfy
      - ${NTFY_DATA_DIR:-/opt/timetrax/ntfy}/config:/etc/ntfy
    networks:
      - timetrax-net
    restart: unless-stopped
