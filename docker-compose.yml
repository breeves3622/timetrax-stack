version: "3.8"

networks:
  timetrex-net:
    name: timetrex-net
    driver: bridge

services:
  # ==========================================
  # 1. TimeTrex Community Edition Open Source Server
  # ==========================================
  timetrex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetrex
    ports:
      - "${TIMETREX_PORT:-8085}:80"
    environment:
      - TIMETREX_DB_HOST=timetrex-db
      - TIMETREX_DB_PORT=5432
      - TIMETREX_DB_NAME=${POSTGRES_DB:-timetrex}
      - TIMETREX_DB_USER=${POSTGRES_USER:-timetrex}
      - TIMETREX_DB_PASSWORD=${POSTGRES_PASSWORD:-timetrexpass}
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-http://ntfy:8080}
      - NTFY_TOPIC=${NTFY_TOPIC:-timetrax-alerts}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${DATA_DIR:-/opt/timetrax/timetrex}/storage:/var/www/html/storage
      - ${DATA_DIR:-/opt/timetrax/timetrex}/includes:/var/www/html/includes
    networks:
      - timetrex-net
    depends_on:
      - timetrex-db
      - ntfy
    restart: unless-stopped

  # ==========================================
  # 2. TimeTrex PostgreSQL Database
  # ==========================================
  timetrex-db:
    image: postgres:15-alpine
    container_name: timetrex-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-timetrex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-timetrexpass}
      - POSTGRES_DB=${POSTGRES_DB:-timetrex}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${DATA_DIR:-/opt/timetrax/db}:/var/lib/postgresql/data
    networks:
      - timetrex-net
    restart: unless-stopped

  # ==========================================
  # 3. TimeTrex to ntfy Webhook Relay Bridge
  # ==========================================
  timetrex-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: timetrex-bridge
    ports:
      - "${BRIDGE_PORT:-5000}:5000"
    environment:
      - BRIDGE_PORT=5000
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-http://ntfy:8080}
      - NTFY_TOPIC=${NTFY_TOPIC:-timetrax-alerts}
      - NTFY_AUTH_TOKEN=${NTFY_AUTH_TOKEN:-}
    networks:
      - timetrex-net
    depends_on:
      - ntfy
    restart: unless-stopped

  # ==========================================
  # 4. Self-Hosted ntfy Push Server
  # ==========================================
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    ports:
      - "${NTFY_PORT:-8080}:8080"
    environment:
      - TZ=${TZ:-America/New_York}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8080}
    volumes:
      - ${NTFY_DATA_DIR:-/opt/timetrax/ntfy}/cache:/var/cache/ntfy
      - ${NTFY_DATA_DIR:-/opt/timetrax/ntfy}/config:/etc/ntfy
    networks:
      - timetrex-net
    restart: unless-stopped
