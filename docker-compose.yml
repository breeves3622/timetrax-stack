version: "3.8"

networks:
  timetrax-net:
    name: timetrax-net
    driver: bridge

services:
  # ==========================================
  # 1. Trackable Open-Source Time Tracker (Django + SQLite)
  # ==========================================
  trackable:
    build:
      context: https://github.com/webcommits/trackable.git#main
      dockerfile: Dockerfile
    container_name: trackable
    ports:
      - "${TIMETREX_PORT:-8099}:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=trackable.settings.prod
      - SECRET_KEY=${SECRET_KEY:-g8f93k2n1m4p5q6r7s8t9u0v1w2x3y4z5a6b7c8d9e0f1g2h3i4j5k6l7m8n9o0p}
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DISABLE_REGISTRATION=False
    volumes:
      - ${DATA_DIR:-/opt/timetrax/trackable}/data:/app/data
      - ${DATA_DIR:-/opt/timetrax/trackable}/media:/app/media
    networks:
      - timetrax-net
    restart: unless-stopped

  # ==========================================
  # 2. TimeTrax to ntfy Webhook Relay Bridge
  # ==========================================
  timetrax-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: timetrax-bridge
    ports:
      - "${BRIDGE_PORT:-8095}:5000"
    environment:
      - BRIDGE_PORT=5000
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-http://ntfy:8080}
      - NTFY_TOPIC=${NTFY_TOPIC:-timetrax-alerts}
      - NTFY_AUTH_TOKEN=${NTFY_AUTH_TOKEN:-}
    networks:
      - timetrax-net
    depends_on:
      - ntfy
    restart: unless-stopped

  # ==========================================
  # 3. Self-Hosted ntfy Push Server
  # ==========================================
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    ports:
      - "${NTFY_PORT:-8080}:8080"
    environment:
      - TZ=${TZ:-America/New_York}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8080}
    volumes:
      - ${NTFY_DATA_DIR:-/opt/timetrax/ntfy}/cache:/var/cache/ntfy
      - ${NTFY_DATA_DIR:-/opt/timetrax/ntfy}/config:/etc/ntfy
    networks:
      - timetrax-net
    restart: unless-stopped
