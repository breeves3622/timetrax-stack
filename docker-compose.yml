version: "3.8"

networks:
  timetrax-net:
    name: timetrax-net
    driver: bridge

services:
  # ==========================================
  # 1. Kimai Open-Source Time Clock Server
  # ==========================================
  kimai:
    image: kimai/kimai2:apache
    container_name: kimai
    ports:
      - "${TIMETREX_PORT:-8090}:8001"
    environment:
      - APP_ENV=prod
      - DATABASE_URL=mysql://${MYSQL_USER:-kimai}:${MYSQL_PASSWORD:-kimaipass}@kimai-db:3306/${MYSQL_DATABASE:-kimai}?charset=utf8mb4&serverVersion=10.11.0-MariaDB
      - TRUSTED_HOSTS=.*
      - ADMINMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMINPASS=${ADMIN_PASSWORD:-AdminPass123!}
      - TZ=${TZ:-America/New_York}
    networks:
      - timetrax-net
    depends_on:
      - kimai-db
      - ntfy
    restart: unless-stopped

  # ==========================================
  # 2. MariaDB Database for Kimai
  # ==========================================
  kimai-db:
    image: mariadb:10.11
    container_name: kimai-db
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-kimai}
      - MYSQL_USER=${MYSQL_USER:-kimai}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-kimaipass}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-kimairootpass}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${DATA_DIR:-/opt/timetrax/db}:/var/lib/mysql
    networks:
      - timetrax-net
    restart: unless-stopped

  # ==========================================
  # 3. TimeTrax to ntfy Webhook Relay Bridge
  # ==========================================
  timetrax-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: timetrax-bridge
    ports:
      - "${BRIDGE_PORT:-8095}:5000"
    environment:
      - BRIDGE_PORT=5000
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-http://ntfy:8080}
      - NTFY_TOPIC=${NTFY_TOPIC:-timetrax-alerts}
      - NTFY_AUTH_TOKEN=${NTFY_AUTH_TOKEN:-}
    networks:
      - timetrax-net
    depends_on:
      - ntfy
    restart: unless-stopped

  # ==========================================
  # 4. Self-Hosted ntfy Push Server
  # ==========================================
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    ports:
      - "${NTFY_PORT:-8080}:8080"
    environment:
      - TZ=${TZ:-America/New_York}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8080}
    volumes:
      - ${NTFY_DATA_DIR:-/opt/timetrax/ntfy}/cache:/var/cache/ntfy
      - ${NTFY_DATA_DIR:-/opt/timetrax/ntfy}/config:/etc/ntfy
    networks:
      - timetrax-net
    restart: unless-stopped
